name: Verify
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/check-publication.mjs
      - name: Shell syntax
        if: runner.os == 'Linux'
        run: |
          for file in scripts/*.sh; do bash -n "$file"; done
          bash tests/config-shell.test.sh
      - name: Windows helper checks without changing network settings
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows-config.test.ps1
